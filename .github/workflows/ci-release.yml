name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Тесты — на каждый пуш/PR.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ./run.sh test

  # Релиз — только при пуше тега v* (после успешных тестов).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release bundle
        run: ./bundle.sh release

      - name: Package zip
        run: ditto -c -k --sequesterRsrc --keepParent Pomodoro.app Pomodoro-macOS.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" Pomodoro-macOS.zip
          --title "Pomodoro ${GITHUB_REF_NAME#v} 🍅"
          --generate-notes
